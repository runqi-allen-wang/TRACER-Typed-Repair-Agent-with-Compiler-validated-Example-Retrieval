name: TRACER 验证

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # GitHub 的全新 runner 比本机慢，端到端编译使用独立的测试预算。
      TRACER_TEST_LEAN_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 此处只安装工具链；项目构建由后面的显式步骤负责。
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      # 端到端测试会调用 Lake 环境，先完成一次项目构建并预热编译环境。
      - name: Build Lean project
        run: lake build
      - name: Check Python modules
        run: python -m compileall -q src scripts tests
      # 固定的 12 个真实 Lean 失败与 3 个基础设施事件；不调用模型 API。
      - name: Verify Compiler Feedback v1 fixtures
        run: python scripts/verify_compiler_feedback_v1.py --verify-only
      # 核对最终冻结 manifest、公开占比修订与运行时预注册；不调用 provider。
      - name: Audit TRACER-REAL v2 enrollment
        run: python src/tracer_real_v2.py audit
      - name: Audit published six-arm research
        run: python scripts/audit_research_release.py published/research-six-arm-313f437f
      # README 图表由已发布 summary.json 确定性生成；避免图、表与发布结果分叉。
      - name: Verify README results chart
        run: |
          python scripts/render_six_arm_chart.py
          git diff --exit-code -- docs/assets/repair24-six-arm-results.svg
      - name: Verify SP security metrics
        run: python src/security_study.py --check published/security-study-tracer-sp-v2/report.json
      # 普通 CI 只核对隔离协议；真实容器探针仅由独立手动工作流执行。
      - name: Verify SP isolation plan
        run: python src/security_isolation.py plan
      # 12 个 core 案例是硬门槛；同时保留 4 个 challenge 的真实回放结果。
      - name: Run Capsule feasibility gate
        run: python scripts/run_capsule_feasibility.py --verify-only
      - name: Run tests
        run: python scripts/run_ci_tests.py
      - name: Audit public capsules
        run: python -m leancapsule audit capsules
      - name: Prepare Mathlib dependency project
        # 下载异常由脚本有限重试；步骤超时避免持续网络故障耗尽 runner 时间。
        timeout-minutes: 30
        shell: bash
        env:
          TRACER_SETUP_ATTEMPTS: "3"
          TRACER_SETUP_RETRY_DELAY: "5"
        run: bash scripts/setup_mathlib.sh
      - name: Replay public capsules
        run: python -m leancapsule verify capsules
