name: Part 1 验证

on:
  push:
  pull_request:

jobs:
  baseline-part1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation deps
        run: python -m pip install pyyaml

      - name: Validate frozen config (contract）
        run: python baseline/config_check.py

      - name: Metrics logger syntax
        run: python -m py_compile baseline/metrics_logger.py

      - name: Metrics mock run + summary
        run: |
          python baseline/metrics_logger.py mock --tasks 5 --jsonl "$RUNNER_TEMP/m.jsonl"
          python baseline/metrics_logger.py summary --jsonl "$RUNNER_TEMP/m.jsonl"

      - name: Check pinned ax-prover commit exists
        run: |
          git ls-remote https://github.com/Axiomatic-AI/ax-prover-base.git \
            | grep -q '06dfadc9ab439755af5efcfe0add95bfef2733c7'

  axprover-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ax-prover
        run: python -m pip install -r requirements-axprover-part2.txt

      - name: Import ax_prover
        run: python -c "import ax_prover; print('ax_prover import OK')"

      - name: Config contract check against ax-prover
        run: python baseline/config_check.py

      - name: Parse Experience config with pinned ax-prover
        run: |
          python - <<'PY'
          from ax_prover.config import Config
          from ax_prover.utils import merge_configs

          config = merge_configs([
              Config(),
              'default.yaml',
              'configs/axprover_part1_experience.yaml',
          ])
          assert config.prover.max_iterations == 4
          assert config.prover.memory_config.class_name == 'ExperienceProcessor'
          assert config.prover.summarize_output.enabled is False
          assert config.prover.prover_llm.model == 'openai:gpt-5.6-sol'
          assert config.prover.prover_llm.provider_config['use_responses_api'] is True
          print('Part 1 Ax config parse OK')
          PY

      - name: ax-prover CLI present
        run: ax-prover --help >/dev/null && echo "ax-prover CLI OK"
