name: Part 1 运行（FATE-M 真实数据）

# 手动触发：避免每次 push 都构建 mathlib（极重）
on:
  workflow_dispatch:

jobs:
  part1-run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FATE_M_COMMIT: 4eb33c8ccd0ff058b461cd763cc406509129743f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ax-prover + deps
        run: python -m pip install -r requirements-axprover-part2.txt pyyaml

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1

      - name: Clone FATE-M
        run: |
          git clone --depth 1 --branch v4.28.0 https://github.com/frenzymath/FATE-M.git /tmp/FATE-M
          test "$(git -C /tmp/FATE-M rev-parse HEAD)" = "$FATE_M_COMMIT"

      # 构建 FATE-M 会拉取并构建 mathlib v4.28.0（几 GB，最耗时/最易超时）
      - name: Build FATE-M (mathlib v4.28.0)
        run: cd /tmp/FATE-M && lake build

      - name: Validate frozen Part 1 contract
        run: python baseline/config_check.py

      - name: Run Experience baseline on FATE-M (3 core tasks)
        run: |
          python baseline/run_batch.py \
            baseline/manifest.json \
            /tmp/FATE-M \
            configs/axprover_part1_experience.yaml \
            runs/baseline.jsonl \
            3 core

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: part1-metrics
          path: runs/baseline.jsonl
