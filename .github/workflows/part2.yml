name: Part 2 CapsuleFeedback 验证

on:
  workflow_dispatch:
  push:
    branches:
      - leiteng
    paths:
      - ".github/workflows/part2.yml"
      - "src/diagnostics.py"
      - "src/leancapsule/**"
      - "leancapsule/**"
      - "tests/test_feedback.py"
      - "tests/test_docs.py"
      - "tests/test_ci.py"
      - "docs/part2_capsule_feedback.md"
      - "README.md"
      - "PROGRESS.md"
  pull_request:
    paths:
      - ".github/workflows/part2.yml"
      - "src/diagnostics.py"
      - "src/leancapsule/**"
      - "leancapsule/**"
      - "tests/test_feedback.py"
      - "tests/test_docs.py"
      - "tests/test_ci.py"
      - "docs/part2_capsule_feedback.md"
      - "README.md"
      - "PROGRESS.md"

permissions:
  contents: read

concurrency:
  group: part2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part2-unit:
    name: Part 2 专项测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CapsuleFeedback and documentation tests
        run: python -m unittest tests.test_feedback tests.test_docs tests.test_ci.ContinuousIntegrationTest.test_part2_workflow_contract -v
      - name: Check both module entrypoints
        run: python -m unittest tests.test_capsule.CapsuleTest.test_both_module_entrypoints_are_usable -v

  repository-regression:
    name: Lean build 与完整 Python 回归
    needs: part2-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACER_TEST_LEAN_TIMEOUT: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Lean project
        run: lake build
      - name: Run complete Python regression suite
        run: python scripts/run_ci_tests.py
