# Part 1 冻结配置（对齐《一些细化idea.md》Part 1）
# 逐条对应：
#   - 冻结模型、工具、预算：prover.*
#   - 先跑 Experience(self_managed)、补充 Memoryless(none)：memory.matrix
#   - 关闭不参与证明的最终 LLM summary：enable_summary=false
#   - 冻结 Lean/Mathlib 环境：environment.*
#   - 缓存每题首轮候选 / 记录编排：run.*
# 说明：真实单价请按你的 API 账单填写 price；或依赖 provider 返回 cost。

prover:
  max_iterations: 50                    # 迭代预算
  prover_llm:
    model: "anthropic:claude-opus-4-20250514"   # 论文最优；按预算可换
    temperature: 0.5
    thinking:
      type: enabled
      budget_tokens: 32000              # 32k 优于 10k
  tools:
    lean_search: true                   # 检索 Mathlib 引理
    web_search: false                   # 竞赛场景几乎没有帮助
  memory:
    mode: self_managed                  # 默认 = Experience memory
    matrix: [self_managed, none]        # 消融：self_managed(Experience) / none(Memoryless)
  reviewer:
    statement_check: true               # 防止定理被篡改
    no_sorry_admit: true                # 禁止占位证明
    unclosed_goal_check: true           # 防止残留未闭合 goal
  enable_summary: false                 # 关闭不参与证明的最终 LLM summary
  budgets:
    max_llm_calls: 50
    max_usd_per_task: null              # 设实数则截断（如 2.0）
    lean_build_timeout_s: 300

run:
  axprover_command: "ax-prover"
  project_dir: ".."                     # Lean 工程目录（含 lakefile）
  skip_build: true                      # 若工程已 build 可跳过
  cache_file: ".baseline_cache.json"    # 首轮候选缓存
  out_dir: "runs"                       # JSONL 输出目录
  price:
    input_usd_per_1k: 0.060             # 近似；请按真实账单覆盖
    output_usd_per_1k: 0.300

environment:
  lean_toolchain: "leanprover/lean4:v4.32.0"   # 锁定 Lean 版本
  mathlib_toolchain: "v4.32.0"                 # 锁定 Mathlib 版本
  use_docker: true                             # 有 Docker 则用镜像跑，绕开本机装 Lean
