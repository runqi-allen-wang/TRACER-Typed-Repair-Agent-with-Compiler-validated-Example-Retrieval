# Part 1 冻结配置（对齐《一些细化idea.md》Part 1）
# 逐条对应：
#   - 冻结模型、工具、预算：prover.*
#   - 先跑 Experience(self_managed)、补充 Memoryless(none)：memory.matrix
#   - 关闭不参与证明的最终 LLM summary：enable_summary=false
#   - 冻结 Lean/Mathlib 环境：environment.*
#   - 缓存每题首轮候选 / 记录编排：run.*
# 说明：真实单价请按你的 API 账单填写 price；或依赖 provider 返回 cost。
# 题集环境锁定到 FATE-M 官方 v4.28.0 tag；Part 1 与 Part 2 必须使用同一工程。

prover:
  max_iterations: 4                     # 迭代预算（降；FATE import Mathlib ~38s/轮）
  prover_llm:
    model: "openai:gpt-5.6-sol"
    provider_config:
      base_url: "https://yxai.chat/v1"
      use_responses_api: true
      store: false
      reasoning:
        effort: "high"
      output_version: "responses/v1"
      max_tokens: null
      profile:
        max_input_tokens: 65536
  tools:
    lean_search: false                  # 配对实验关闭外部检索，减少不可控漂移
    web_search: false
  memory:
    mode: self_managed                  # 默认 = Experience memory
    matrix: [self_managed, none]        # 消融：self_managed(Experience) / none(Memoryless)
  reviewer:
    statement_check: true               # 防止定理被篡改
    no_sorry_admit: true                # 禁止占位证明
    unclosed_goal_check: true           # 防止残留未闭合 goal
  enable_summary: false                 # 关闭不参与证明的最终 LLM summary
  budgets:
    max_llm_calls: 12                   # 4 轮下 proposer/memory/reviewer 的理论上界
    max_usd_per_task: null              # 设实数则截断（如 2.0）
    lean_build_timeout_s: 300

run:
  axprover_command: "ax-prover"
  project_dir: "FATE-M"                 # 官方 v4.28.0 tag 的本地 checkout
  skip_build: true                      # 若工程已 build 可跳过
  cache_file: ".baseline_cache.json"    # 首轮候选缓存
  out_dir: "runs"                       # JSONL 输出目录
  price:
    input_usd_per_1k: null              # 中转站未提供正式单价时保持未知
    output_usd_per_1k: null

environment:
  benchmark_ref: "v4.28.0"
  lean_toolchain: "leanprover/lean4:v4.28.0"
  mathlib_toolchain: "v4.28.0"
  use_docker: false                            # 当前版本已移除 Dockerfile，使用本地冻结工具链
